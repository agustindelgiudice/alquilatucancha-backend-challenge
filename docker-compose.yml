version: '3.7'
services:
  api:
    image: atc-challenge:dev
    build:
      dockerfile: Dockerfile
      context: .
      target: development
    volumes:
      - .:/usr/src/app
    command: npm run start:dev
    ports:
      - 3000:3000
    environment:
      PORT: 3000
      ATC_BASE_URL: http://mock:4000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      default:
        aliases:
          - api

  mock:
    image: atc-challenge:dev
    command: node /usr/src/app/mock/server.js
    volumes:
      - ./mock:/usr/src/app/mock
    ports:
      - 4000:4000
    environment:
      EVENT_INTERVAL_SECONDS: 10
      REQUESTS_PER_MINUTE: 60
      EVENT_PUBLISHER_URL: http://api:3000/events
      PORT: 4000
    networks:
      default:
        aliases:
          - mock

  redis:
    image: redis:latest
    ports:
      - 6379:6379
    environment:
      REDIS_DISABLE_COMMANDS: FLUSHDB,FLUSHALL
    networks:
      default:
        aliases:
          - redis

networks:
  default:
    driver: bridge